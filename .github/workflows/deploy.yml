name: Deploy Backend

# 2026-09-01: 정본 배포처가 GitHub Pages에서 Firebase Hosting(voice-cinema.web.app)으로
# 이전됨 — 이 워크플로우가 storage+functions에 더해 hosting까지 배포한다.
# 2026-09-08: GitHub Pages를 폐지해 배포처는 Firebase Hosting 한 곳뿐이다.
# 2026-09-09: 정본 주소가 voice.edutogether.kr(커스텀 도메인)로 바뀌었다 — 아래
# 스모크 검증이 그 주소를 본다. voice-cinema.web.app도 같은 Hosting 사이트라
# 계속 살아 있지만, 검증은 실사용자가 실제로 여는 주소를 봐야 의미가 있다
# (옛 주소만 보면 새 주소가 죽어도 CI가 초록으로 나온다).
#
# CI(lint+test+e2e) 워크플로우가 통과한 뒤에만 이어서 실행되도록 workflow_run으로 연결한다
# (push 트리거를 따로 두면 테스트 없이 배포될 수 있어 이렇게 묶었다).
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]

# 종합감사(2026-09-02) 발견 반영: concurrency 그룹이 없어서 연속 push로 CI가
# 두 번 이상 겹쳐 끝나면 이 워크플로우도 겹쳐 실행돼 배포 순서가 역전(늦게
# 커밋한 게 먼저 배포되고, 그 뒤에 이전 커밋이 나중에 덮어씀)될 수 있었다.
# cancel-in-progress는 쓰지 않는다 — firebase deploy 도중 잡을 강제 종료하면
# functions/hosting 일부만 반영된 상태로 끊길 수 있어, 겹치지 않게 순서대로
# 대기시키는 쪽(기본값)이 더 안전하다.
concurrency:
  group: deploy-voice-cinema

permissions:
  contents: read
  actions: read

jobs:
  # 문서만 고친 커밋에는 배포를 돌리지 않는다(COMMON_STANDARDS §23).
  #
  # 🔴 이 판정을 CI 쪽에 걸면 안 된다. e2e/document-freshness.spec.js가 **문서를
  # 검사 대상으로 삼는다** — /privacy.html이 프리캐시 목록에 들어 있어서, 서비스워커
  # 분기 순서가 어긋나면 새로 배포해도 기기에서 옛 화면이 계속 나온다. 문서 변경에
  # 테스트를 건너뛰면 바로 그 회귀를 못 잡는다. 그래서 배포 잡에만 건다.
  #
  # paths-ignore를 쓸 수 없다 — 이 워크플로우는 push가 아니라 workflow_run으로
  # 걸려 있고 그 트리거는 경로 필터를 지원하지 않는다. 대신 **마지막으로 실제 배포에
  # 성공한 커밋**과 비교한다. 부모 커밋(HEAD~1)과 비교하면 여러 커밋을 한 번에
  # 푸시했을 때 앞 커밋의 코드 변경을 놓친다.
  changes:
    name: 배포가 필요한 변경인지 판정
    runs-on: ubuntu-latest
    # 배포는 이 저장소의 master에 대한 push로 끝난 CI에서만 돈다(2026-10-05, 보안 지적 대응).
    # deploy 잡은 needs: changes라 이 조건을 그대로 따른다.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      deploy_needed: ${{ steps.judge.outputs.deploy_needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      # 판단은 tools/deploy-gate.js가 한다(단위 검사 test/deploy-gate.test.js). 여기서는 값만 모은다.
      # 2026-10-08: 이 실행의 커밋이 지금 master 끝이 아니면 배포하지 않는다 — GitHub 장애로 묶인 옛
      # 실행이 나중에 풀려 새 배포를 덮어쓰는 것을 막는다. 끝을 못 구하면 실패로 끝난다.
      # 비교 기준은 "마지막으로 성공한 워크플로"가 아니라 "deploy 잡이 실제로 성공한 실행"이다 —
      # 건너뛴 실행도 워크플로는 성공으로 남아, 그것을 기준으로 삼으면 앞 커밋의 코드가 영영 안 나간다.
      - id: judge
        env:
          GH_TOKEN: ${{ github.token }}
          NOW: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e
          TIP=$(git ls-remote origin refs/heads/master | cut -f1 || true)
          LAST=""
          for id in $(gh run list --workflow "Deploy Backend" --status success --branch master --limit 30 --json databaseId -q '.[].databaseId' 2>/dev/null || true); do
            sha=$(gh run view "$id" --json headSha,jobs -q 'select(any(.jobs[]; .name == "deploy" and .conclusion == "success")) | .headSha' 2>/dev/null || true)
            if [ -n "$sha" ]; then LAST=$sha; break; fi
          done
          CHANGED=""
          if [ -n "$LAST" ] && git cat-file -e "$LAST^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$LAST" "$NOW")
          else
            LAST=""
          fi
          TIP="$TIP" LAST="$LAST" CHANGED="$CHANGED" node tools/deploy-gate.js

  deploy:
    needs: changes
    runs-on: ubuntu-latest
    # FIREBASE_SERVICE_ACCOUNT 저장소 시크릿 등록 완료(2026-08-29, 대표 확인).
    # 참고: job 레벨 if:에는 secrets 컨텍스트를 못 쓴다(GitHub Actions 제약) —
    # 처음엔 "시크릿 없으면 스킵"을 여기서 걸려다 워크플로우 파일 자체가
    # 파싱조차 안 되는 걸로 실측 확인해서(2026-08-29) 뺐다.
    if: needs.changes.outputs.deploy_needed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      # 2026-09-08 리액트 전환: 배포 폴더가 docs/(소스 그대로)에서 dist/(빌드
      # 산출물)로 바뀌었다. dist/는 저장소에 없으므로 여기서 반드시 빌드해야 한다 —
      # 이 단계가 없으면 hosting 배포가 빈 폴더를 올리거나 아예 실패한다.
      - run: npm ci
      - run: npm run build
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      # storage rules와 functions를 먼저 배포하고, hosting은 그 다음 단계로
      # 순서를 명시한다 — 코디세이 기준(규칙/functions 먼저, hosting 나중)과 동일.
      # 배포 도구는 정확한 버전으로 고정한다 — 실행할 때마다 최신판을 받지 않는다(2026-10-05).
      # 올릴 때는 분기 감사 때 이 두 줄을 함께 바꾼다.
      - run: npx --yes firebase-tools@15.32.1 deploy --only storage,functions --project inky-voice-cinema --non-interactive
      - run: npx --yes firebase-tools@15.32.1 deploy --only hosting:voice-cinema --project inky-voice-cinema --non-interactive
      # 종합감사(2026-09-02) 발견 반영: 로컬 E2E는 통과했는데 배포된 사이트에서만
      # CSP가 인라인 onclick 핸들러를 막아 버튼 8개가 죽었던 회귀(CLAUDE.md 기록)를
      # 이 파이프라인이 자동으로 잡을 방법이 없었다 — Hosting과 Functions가 실제로
      # 살아있는지 배포 직후 최소한으로 확인한다.
      - name: 배포 후 라이브 스모크 검증
        run: |
          set -e
          hosting_status=$(curl -s -o /dev/null -w '%{http_code}' https://voice.edutogether.kr/)
          if [ "$hosting_status" != "200" ]; then
            echo "Hosting 응답이 200이 아님: $hosting_status"
            exit 1
          fi
          functions_body=$(curl -s https://asia-northeast3-inky-voice-cinema.cloudfunctions.net/voiceCinema/)
          echo "$functions_body" | grep -q '"ok":true' || { echo "Functions 응답에 ok:true 없음: $functions_body"; exit 1; }
          # 빌드 산출물이 실제로 올라갔는지 확인한다 — index.html이 해시 붙은
          # 번들을 가리키고, 서비스워커가 프리캐시 목록을 담은 채 서빙돼야 한다.
          # (빈 dist/를 배포하면 200은 나와도 이 검사에서 걸린다.)
          home=$(curl -s https://voice.edutogether.kr/)
          echo "$home" | grep -qE '/assets/main-[A-Za-z0-9_-]+\.js' || { echo "index.html에 빌드된 번들 참조가 없음"; exit 1; }
          sw=$(curl -s https://voice.edutogether.kr/sw.js)
          echo "$sw" | grep -q '/vendor/ffmpeg-core/ffmpeg-core.wasm' || { echo "sw.js 프리캐시 목록에 엔진이 없음"; exit 1; }
          echo "$sw" | grep -q '/index.html' || { echo "sw.js 프리캐시 목록에 진입점이 없음"; exit 1; }
