name: Deploy Backend

# 2026-09-01: 정본 배포처가 GitHub Pages에서 Firebase Hosting(voice-cinema.web.app)으로
# 이전됨 — 이 워크플로우가 storage+functions에 더해 hosting까지 배포한다.
# 2026-09-08: GitHub Pages를 폐지해 배포처는 Firebase Hosting 한 곳뿐이다.
# 2026-09-09: 정본 주소가 voice.edutogether.kr(커스텀 도메인)로 바뀌었다 — 아래
# 스모크 검증이 그 주소를 본다. voice-cinema.web.app도 같은 Hosting 사이트라
# 계속 살아 있지만, 검증은 실사용자가 실제로 여는 주소를 봐야 의미가 있다
# (옛 주소만 보면 새 주소가 죽어도 CI가 초록으로 나온다).
#
# CI(lint+test+e2e) 워크플로우가 통과한 뒤에만 이어서 실행되도록 workflow_run으로 연결한다
# (push 트리거를 따로 두면 테스트 없이 배포될 수 있어 이렇게 묶었다).
#
# 2026-10-08: 매시 대조와 수동 실행을 같은 파일에 더했다. 라이브(Hosting·Functions에 배포 잡이 남긴 배포
# 커밋)가 master 끝보다 뒤처졌거나 다르면 master 끝을 같은 배포 잡으로 다시 배포한다 — GitHub 장애로 묶여
# 지울 수 없는 옛 실행이 나중에 풀려 옛 커밋을 덮어써도 한 시간 안에 되돌린다. 같은 파일·같은 동시성
# 그룹이라 배포 경로가 하나다.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]
  # 정각이 아니라 17분 — GitHub은 정각에 몰리는 예약 실행을 늦추거나 빠뜨린다.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '판정만 하고 배포하지 않는다'
        type: boolean
        default: true
      pretend_live:
        description: '검사용 — 라이브 커밋을 이 값으로 가정한다(비우면 실제 라이브를 읽는다)'
        type: string
        default: ''

# 종합감사(2026-09-02) 발견 반영: concurrency 그룹이 없어서 연속 push로 CI가
# 두 번 이상 겹쳐 끝나면 이 워크플로우도 겹쳐 실행돼 배포 순서가 역전(늦게
# 커밋한 게 먼저 배포되고, 그 뒤에 이전 커밋이 나중에 덮어씀)될 수 있었다.
# cancel-in-progress는 쓰지 않는다 — firebase deploy 도중 잡을 강제 종료하면
# functions/hosting 일부만 반영된 상태로 끊길 수 있어, 겹치지 않게 순서대로
# 대기시키는 쪽(기본값)이 더 안전하다.
#
# 그룹 이름을 2026-10-08에 바꿨다: 2026-10-07 GitHub 장애로 옛 그룹(deploy-voice-cinema)에
# queued 실행이 잡 0개로 묶였고, 취소·강제 취소·재실행·삭제가 전부 거부돼 지울 수 없었다.
# 그 뒤 이 워크플로의 새 실행이 그 그룹 뒤에 줄을 서서 움직이지 않았다. 옛 그룹에 남은 실행 셋 중
# 75ef607의 둘은 풀려도 tools/deploy-gate.js가 "master 끝이 아니다"로 건너뛰지만, a357c51의 하나
# (37642382427)는 그 판정이 생기기 전 워크플로로 만들어져 옛 커밋을 배포할 수 있다 — 매시 대조가 되돌린다.
concurrency:
  group: deploy-voice-cinema-v2

permissions:
  contents: read
  actions: read

jobs:
  # 문서만 고친 커밋에는 배포를 돌리지 않는다(COMMON_STANDARDS §23).
  #
  # 🔴 이 판정을 CI 쪽에 걸면 안 된다. e2e/document-freshness.spec.js가 **문서를
  # 검사 대상으로 삼는다** — /privacy.html이 프리캐시 목록에 들어 있어서, 서비스워커
  # 분기 순서가 어긋나면 새로 배포해도 기기에서 옛 화면이 계속 나온다. 문서 변경에
  # 테스트를 건너뛰면 바로 그 회귀를 못 잡는다. 그래서 배포 잡에만 건다.
  #
  # paths-ignore를 쓸 수 없다 — 이 워크플로우는 push가 아니라 workflow_run으로
  # 걸려 있고 그 트리거는 경로 필터를 지원하지 않는다. 대신 **지금 라이브에 배포된
  # 커밋**과 비교한다(2026-10-08부터 — 그전에는 실행 기록의 마지막 배포). 부모 커밋(HEAD~1)과
  # 비교하면 여러 커밋을 한 번에 푸시했을 때 앞 커밋의 코드 변경을 놓친다.
  changes:
    name: 배포가 필요한 변경인지 판정
    runs-on: ubuntu-latest
    # CI 뒤의 배포는 이 저장소의 master에 대한 push로 끝난 CI에서만 돈다(2026-10-05, 보안 지적 대응).
    # 매시 대조·수동 실행은 master에서만 돌고, master 끝의 CI 통과를 판정에서 따로 확인한다.
    # deploy 잡은 needs: changes라 이 조건을 그대로 따른다.
    if: >-
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      deploy_needed: ${{ steps.judge.outputs.deploy_needed }}
      sha: ${{ steps.judge.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      # 판단은 tools/deploy-gate.js가 한다(단위 검사 test/deploy-gate.test.js). 여기서는 값만 모은다.
      # - 이 실행의 커밋(NOW): CI 뒤에는 그 CI의 커밋, 매시 대조·수동 실행에는 지금 master 끝.
      #   CI 뒤의 실행도 지금 master 끝이 아니면 배포하지 않는다 — 묶인 옛 실행이 새 배포를 덮어쓰지 않게.
      # - master 끝의 CI: 매시 대조·수동 실행은 master push로 돈 CI가 하나라도 통과했는지 본다.
      # - 라이브 배포 커밋: 배포 잡이 남긴 표시(Hosting /version.json, Functions GET /의 commit).
      #   못 읽으면(연결 실패·5xx) tools/live-commit.js가 실패로 끝낸다. 수동 실행의 pretend_live가 이 값을 대신한다.
      # 끝이나 CI 결과를 못 구하면 판정이 실패로 끝난다 — "건너뜀"으로 세지 않는다.
      - id: judge
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          PRETEND_LIVE: ${{ inputs.pretend_live }}
        run: |
          set -e
          TIP=$(git ls-remote origin refs/heads/master | cut -f1 || true)
          if [ "$EVENT" = "workflow_run" ]; then
            NOW=$RUN_SHA
            CI=success # 이 잡의 if가 CI 성공으로 끝난 실행만 들인다
          else
            NOW=$TIP
            CI=""
            if [ -n "$TIP" ]; then
              git fetch --quiet origin master
              CI=$(gh run list --workflow CI --commit "$TIP" --limit 20 --json event,headBranch,status,conclusion -q '[.[] | select(.event == "push" and .headBranch == "master")] | if length == 0 then "none" elif any(.[]; .conclusion == "success") then "success" elif any(.[]; .status != "completed") then "in_progress" else .[0].conclusion end')
            fi
          fi
          if [ -n "$PRETEND_LIVE" ]; then
            P=$(git rev-parse --verify "$PRETEND_LIVE^{commit}")
            echo "검사용 입력: 라이브를 $P로 가정한다"
            LIVE_HOSTING=$P
            LIVE_FUNCTIONS=$P
          else
            LIVE_HOSTING=$(node tools/live-commit.js https://voice.edutogether.kr/version.json)
            LIVE_FUNCTIONS=$(node tools/live-commit.js https://asia-northeast3-inky-voice-cinema.cloudfunctions.net/voiceCinema/)
          fi
          CHANGED=""
          if [ -n "$NOW" ] && [ -n "$LIVE_HOSTING" ] && [ "$LIVE_HOSTING" = "$LIVE_FUNCTIONS" ] && git cat-file -e "$LIVE_HOSTING^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$LIVE_HOSTING" "$NOW")
          fi
          NOW="$NOW" TIP="$TIP" CI="$CI" LIVE_HOSTING="$LIVE_HOSTING" LIVE_FUNCTIONS="$LIVE_FUNCTIONS" CHANGED="$CHANGED" node tools/deploy-gate.js

  deploy:
    needs: changes
    runs-on: ubuntu-latest
    # FIREBASE_SERVICE_ACCOUNT 저장소 시크릿 등록 완료(2026-08-29, 대표 확인).
    # 참고: job 레벨 if:에는 secrets 컨텍스트를 못 쓴다(GitHub Actions 제약) —
    # 처음엔 "시크릿 없으면 스킵"을 여기서 걸려다 워크플로우 파일 자체가
    # 파싱조차 안 되는 걸로 실측 확인해서(2026-08-29) 뺐다.
    if: needs.changes.outputs.deploy_needed == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      # 2026-09-08 리액트 전환: 배포 폴더가 docs/(소스 그대로)에서 dist/(빌드
      # 산출물)로 바뀌었다. dist/는 저장소에 없으므로 여기서 반드시 빌드해야 한다 —
      # 이 단계가 없으면 hosting 배포가 빈 폴더를 올리거나 아예 실패한다.
      - run: npm ci
      - run: npm run build
      # 배포 커밋 표시(2026-10-08) — 매시 대조가 이 두 값을 master 끝과 비교한다. 빌드 뒤에 쓴다:
      # dist/version.json은 빌드 산출물이 아니라 프리캐시 목록·서비스워커 캐시 이름에 들지 않고, 그래서
      # 커밋이 바뀌어도 부스 기기 캐시를 건드리지 않는다. functions/.env는 firebase deploy가 함수 환경변수로 넘긴다.
      - name: 배포 커밋 표시 남기기
        env:
          SHA: ${{ needs.changes.outputs.sha }}
        run: |
          printf 'DEPLOY_COMMIT=%s\n' "$SHA" > functions/.env
          printf '{"commit":"%s"}\n' "$SHA" > dist/version.json
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      # storage rules와 functions를 먼저 배포하고, hosting은 그 다음 단계로
      # 순서를 명시한다 — 코디세이 기준(규칙/functions 먼저, hosting 나중)과 동일.
      # 배포 도구는 정확한 버전으로 고정한다 — 실행할 때마다 최신판을 받지 않는다(2026-10-05).
      # 올릴 때는 분기 감사 때 이 두 줄을 함께 바꾼다.
      - run: npx --yes firebase-tools@15.32.1 deploy --only storage,functions --project inky-voice-cinema --non-interactive
      - run: npx --yes firebase-tools@15.32.1 deploy --only hosting:voice-cinema --project inky-voice-cinema --non-interactive
      # 종합감사(2026-09-02) 발견 반영: 로컬 E2E는 통과했는데 배포된 사이트에서만
      # CSP가 인라인 onclick 핸들러를 막아 버튼 8개가 죽었던 회귀(CLAUDE.md 기록)를
      # 이 파이프라인이 자동으로 잡을 방법이 없었다 — Hosting과 Functions가 실제로
      # 살아있는지 배포 직후 최소한으로 확인한다.
      - name: 배포 후 라이브 스모크 검증
        env:
          SHA: ${{ needs.changes.outputs.sha }}
        run: |
          set -e
          hosting_status=$(curl -s -o /dev/null -w '%{http_code}' https://voice.edutogether.kr/)
          if [ "$hosting_status" != "200" ]; then
            echo "Hosting 응답이 200이 아님: $hosting_status"
            exit 1
          fi
          functions_body=$(curl -s https://asia-northeast3-inky-voice-cinema.cloudfunctions.net/voiceCinema/)
          echo "$functions_body" | grep -q '"ok":true' || { echo "Functions 응답에 ok:true 없음: $functions_body"; exit 1; }
          # 빌드 산출물이 실제로 올라갔는지 확인한다 — index.html이 해시 붙은
          # 번들을 가리키고, 서비스워커가 프리캐시 목록을 담은 채 서빙돼야 한다.
          # (빈 dist/를 배포하면 200은 나와도 이 검사에서 걸린다.)
          home=$(curl -s https://voice.edutogether.kr/)
          echo "$home" | grep -qE '/assets/main-[A-Za-z0-9_-]+\.js' || { echo "index.html에 빌드된 번들 참조가 없음"; exit 1; }
          sw=$(curl -s https://voice.edutogether.kr/sw.js)
          echo "$sw" | grep -q '/vendor/ffmpeg-core/ffmpeg-core.wasm' || { echo "sw.js 프리캐시 목록에 엔진이 없음"; exit 1; }
          echo "$sw" | grep -q '/index.html' || { echo "sw.js 프리캐시 목록에 진입점이 없음"; exit 1; }
          # 라이브 두 곳이 방금 배포한 커밋을 가리키는지 본다 — 매시 대조가 믿는 값이 실제로 바뀌었는지.
          # 새 함수 버전이 요청을 넘겨받기까지 잠깐 걸릴 수 있어 몇 번 다시 본다.
          for i in 1 2 3 4 5 6; do
            h=$(node tools/live-commit.js https://voice.edutogether.kr/version.json || true)
            f=$(node tools/live-commit.js https://asia-northeast3-inky-voice-cinema.cloudfunctions.net/voiceCinema/ || true)
            if [ "$h" = "$SHA" ] && [ "$f" = "$SHA" ]; then echo "라이브 배포 커밋 표시 확인: $SHA"; break; fi
            if [ "$i" = 6 ]; then echo "라이브 배포 커밋 표시가 $SHA가 아님 — Hosting ${h:-없음} · Functions ${f:-없음}"; exit 1; fi
            sleep 10
          done
