name: Deploy Backend

# GitHub Pages(docs/)는 저장소 설정이 legacy 방식(브랜치 master · 경로 /docs)이라
# push마다 GitHub 자체가 이미 자동 배포한다 — 이 워크플로우는 그 대상이 아니다.
# 여기서 다루는 건 지금까지 수동으로만 해오던 Firebase Functions + Storage rules 배포.
#
# CI(lint+test+e2e) 워크플로우가 통과한 뒤에만 이어서 실행되도록 workflow_run으로 연결한다
# (push 트리거를 따로 두면 테스트 없이 배포될 수 있어 이렇게 묶었다).
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # FIREBASE_SERVICE_ACCOUNT 저장소 시크릿이 등록돼 있어야 동작한다. 서비스 계정
    # 생성·키 발급은 GCP 콘솔 권한이 필요한 작업이라 이 세션이 대신할 수 없다 —
    # poster-studio와 동일한 구조적 제약(대표가 콘솔에서 한 번 등록해야 함).
    # 시크릿이 없으면 이 job은 조용히 스킵되고, 등록되는 순간 별도 수정 없이 바로 동작한다.
    if: github.event.workflow_run.conclusion == 'success' && secrets.FIREBASE_SERVICE_ACCOUNT != ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      # storage rules와 functions를 한 번에 — "규칙/functions 먼저" 순서를 위해
      # hosting(=GitHub Pages, 별도 자동배포)과는 완전히 분리해서 다룬다.
      - run: npx firebase-tools deploy --only storage,functions --project inky-voice-cinema --non-interactive
