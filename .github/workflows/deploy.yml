name: Deploy Backend

# 2026-09-01: 정본 배포처가 GitHub Pages(edutogether.github.io)에서
# Firebase Hosting(voice-cinema.web.app)으로 이전됨 — 이제 이 워크플로우가
# storage+functions에 더해 hosting까지 함께 배포한다. GitHub Pages(docs/)는
# 당분간 병행 운영(포털 카드 링크 교체 전까지)이라 아직 자동배포가 남아있지만
# 정본은 Firebase Hosting 쪽이다.
#
# CI(lint+test+e2e) 워크플로우가 통과한 뒤에만 이어서 실행되도록 workflow_run으로 연결한다
# (push 트리거를 따로 두면 테스트 없이 배포될 수 있어 이렇게 묶었다).
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # FIREBASE_SERVICE_ACCOUNT 저장소 시크릿 등록 완료(2026-08-29, 대표 확인).
    # 참고: job 레벨 if:에는 secrets 컨텍스트를 못 쓴다(GitHub Actions 제약) —
    # 처음엔 "시크릿 없으면 스킵"을 여기서 걸려다 워크플로우 파일 자체가
    # 파싱조차 안 되는 걸로 실측 확인해서(2026-08-29) 뺐다.
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      # storage rules와 functions를 먼저 배포하고, hosting은 그 다음 단계로
      # 순서를 명시한다 — 코디세이 기준(규칙/functions 먼저, hosting 나중)과 동일.
      - run: npx firebase-tools deploy --only storage,functions --project inky-voice-cinema --non-interactive
      - run: npx firebase-tools deploy --only hosting:voice-cinema --project inky-voice-cinema --non-interactive
