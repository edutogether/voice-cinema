name: Deploy Backend

# GitHub Pages(docs/)는 저장소 설정이 legacy 방식(브랜치 master · 경로 /docs)이라
# push마다 GitHub 자체가 이미 자동 배포한다 — 이 워크플로우는 그 대상이 아니다.
# 여기서 다루는 건 지금까지 수동으로만 해오던 Firebase Functions + Storage rules 배포.
#
# CI(lint+test+e2e) 워크플로우가 통과한 뒤에만 이어서 실행되도록 workflow_run으로 연결한다
# (push 트리거를 따로 두면 테스트 없이 배포될 수 있어 이렇게 묶었다).
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # FIREBASE_SERVICE_ACCOUNT 저장소 시크릿 등록 완료(2026-08-29, 대표 확인).
    # 참고: job 레벨 if:에는 secrets 컨텍스트를 못 쓴다(GitHub Actions 제약) —
    # 처음엔 "시크릿 없으면 스킵"을 여기서 걸려다 워크플로우 파일 자체가
    # 파싱조차 안 되는 걸로 실측 확인해서(2026-08-29) 뺐다.
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      # storage rules와 functions를 한 번에 — "규칙/functions 먼저" 순서를 위해
      # hosting(=GitHub Pages, 별도 자동배포)과는 완전히 분리해서 다룬다.
      - run: npx firebase-tools deploy --only storage,functions --project inky-voice-cinema --non-interactive
