name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# CodeQL 지적 반영(2026-09-10, actions/missing-workflow-permissions).
# 적지 않으면 저장소 기본값이 적용되는데, 그 기본값은 언제든 넓어질 수 있다.
# 이 워크플로는 코드를 읽어 검사만 하므로 읽기 하나면 충분하다 — 배포는
# deploy.yml이 따로 하고 그쪽은 자기 권한을 따로 적어 뒀다.
permissions:
  contents: read

jobs:
  lint-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # 🔴 functions 의존성을 테스트 **전에** 깔아야 한다. 루트 `npm test`는
      # `vitest run && cd functions && npm test`라 functions 테스트까지 이어서 도는데,
      # 그때 functions/node_modules가 없으면 그쪽 소스를 import하는 테스트가 죽는다
      # (vitest 자체는 npm이 상위 node_modules/.bin을 PATH에 넣어줘서 돌아간다 —
      # 그래서 여태 안 터졌을 뿐이고, 의존성을 import하는 테스트가 처음 생긴
      # 2026-09-10에 `Cannot find package 'firebase-functions/v2/https'`로 드러났다).
      - run: npm install
        working-directory: functions
      - run: npm run lint
      - run: npm test
      - name: functions 의존성 취약점 확인 (참고용, 실패해도 CI를 막지 않음)
        working-directory: functions
        # 종합감사(2026-09-02) 발견 반영: 주석과 달리 continue-on-error가 없어서
        # 실제로는 high 취약점이 뜨는 순간 이 스텝이 CI 잡을 실패시키고,
        # deploy.yml의 workflow_run 조건(conclusion == 'success') 때문에 배포
        # 전체가 막혔다 — Google 쪽 전이 의존성에 high 하나만 새로 잡혀도
        # 긴급 수정조차 배포할 수 없는 상태였다. 참고용이라는 주석 그대로
        # 동작하도록 continue-on-error를 추가한다.
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # --with-deps를 쓰지 않는다. 그 옵션만이 apt를 건드리는 부분인데,
      # 2026-09-10에 Google의 apt 저장소가 자기 Release 파일이 약속한 해시와 다른
      # Packages.gz를 내려주는 바람에(Release는 233e56de…, 실제 파일은 bc1428ab…,
      # 이 세션 PC에서 직접 받아 CI 로그와 같은 값임을 확인) 브라우저 설치가 죽고
      # 테스트가 한 개도 실행되지 못했다. 재시도는 소용이 없다 — 깨진 것이 원격
      # 인덱스라 캐시를 지우고 다시 받아도 같은 파일을 받는다.
      # ubuntu-latest에는 크로미움 구동에 필요한 라이브러리가 이미 들어 있다.
      # 나중에 무엇이 없다고 하면 저장소 인덱스를 통째로 갱신하지 말고 그 라이브러리만 설치한다.
      - name: Playwright 버전 확인
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # 버전이 오르면 키가 갈려 자동으로 새로 받는다. 캐시가 비어도 아래 install이
      # 그냥 받으므로 정상 동작한다 — 캐시 미스는 실패가 아니라 정상 경로다.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
