<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>InKY Voice Cinema</title>
<meta name="description" content="무성영화에 내 목소리를 더빙해서 나만의 영화를 완성해봐요 🎬🎤">
<!-- 카카오톡·메신저에 링크를 붙일 때 보이는 카드. 포털(edutogether.kr)과 같은 그림을 쓴다.
     그림을 webp가 아니라 jpg로 두는 것은 카카오톡이 webp 썸네일을 제대로 못 쓰기 때문이고,
     포털 주소를 가리키지 않고 여기서 직접 배포하는 것은 다른 저장소의 배포 일정에 이 앱의
     공유 카드가 딸려가지 않게 하려는 것이다. og:image는 반드시 절대주소여야 한다. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://voice.edutogether.kr/">
<meta property="og:title" content="InKY Voice Cinema">
<meta property="og:description" content="무성영화에 내 목소리를 더빙해서 나만의 영화를 완성해봐요 🎬🎤">
<meta property="og:image" content="https://voice.edutogether.kr/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="InKY Voice Cinema">
<meta name="twitter:description" content="무성영화에 내 목소리를 더빙해서 나만의 영화를 완성해봐요 🎬🎤">
<meta name="twitter:image" content="https://voice.edutogether.kr/og.jpg">
<!-- 인라인 스크립트는 두지 않는다 — CSP의 script-src에 해시를 박으면 내용이 바뀔
     때마다 firebase.json을 같이 고쳐야 하고, 잊으면 배포된 사이트에서만 화면이 죽는다.
     파비콘 생성과 스플래시 제거는 각각 src/lib/favicon.ts와 src/lib/splash.ts로 옮겼다. -->
<script src="/vendor/qrcode.js"></script>
  <link rel="stylesheet" href="/fonts/pretendard.css">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/pretendard-400.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/pretendard-500.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/pretendard-600.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/pretendard-800.woff2">
</head>
<body>
<!-- 스플래시는 정적 마크업으로 둔다 — 리액트가 그리면 번들 로드 전까지 빈 화면이
     잠깐 보인다. 사라지는 시점만 src/lib/splash.ts가 맡는다. -->
<div id="splash">
  <div class="logo">🎙️</div>
  <div class="name">InKY <span class="gold">Voice Cinema</span></div>
  <div class="stagline">무성영화에 내 목소리를 더빙해 완성하는 나만의 영화</div>
  <span class="sbar"><i></i></span>
</div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
