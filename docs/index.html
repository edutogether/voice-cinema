<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>InKY Voice Cinema</title>
<link id="favicon" rel="icon" href="">
<script>
  (function () {
    function makeFavicon(gray) {
      var size = 64;
      var c = document.createElement('canvas');
      c.width = c.height = size;
      var ctx = c.getContext('2d');
      ctx.font = (size * 0.8) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🎙️', size / 2, size / 2 + 2);
      if (gray) {
        var img = ctx.getImageData(0, 0, size, size);
        var d = img.data;
        for (var i = 0; i < d.length; i += 4) {
          var v = d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11;
          d[i] = d[i + 1] = d[i + 2] = v;
        }
        ctx.putImageData(img, 0, 0);
      }
      return c.toDataURL('image/png');
    }
    var colorHref, grayHref;
    // href만 바꾸면 크롬이 백그라운드 탭에서 파비콘을 다시 그리지 않는 경우가 있어,
    // 링크 엘리먼트 자체를 매번 새로 만들어 교체한다(실제 대표 테스트로 재현·확인, 2026-08-31).
    function apply(gray) {
      var href = gray
        ? (grayHref || (grayHref = makeFavicon(true)))
        : (colorHref || (colorHref = makeFavicon(false)));
      document.querySelectorAll('link[rel~="icon"]').forEach(function (el) { el.remove(); });
      var link = document.createElement('link');
      link.id = 'favicon';
      link.rel = 'icon';
      link.href = href;
      document.head.appendChild(link);
    }
    function sync() { apply(document.hidden); }
    document.addEventListener('DOMContentLoaded', sync);
    document.addEventListener('visibilitychange', sync);
    window.addEventListener('blur', function () { apply(true); });
    window.addEventListener('focus', function () { apply(document.hidden); });
  })();
</script>
<style>
  :root{
    --bg:#0a0e1c; --bg2:#0b1128; --panel:#141c3a; --panel2:#1b2549;
    --gold:#e9c46a; --gold-soft:#f2cf6b; --cream:#f6f1e6;
    --muted:#9aa6cc; --line:rgba(233,196,106,.22);
    --ok:#39d59a; --danger:#ff5470;
    --shadow:0 24px 60px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* 2026-09-03 발견 반영: html/body에 고정 height:100%를 걸어뒀던 탓에, 카드를
     2배로 키우면서 내용이 한 화면 높이를 넘기자 그 초과분이 body 박스 "밖"에서
     렌더링돼 배경이 없는 흰 화면으로 보이는 버그가 있었다(이전엔 화면이 항상
     정확히 한 화면 안에 맞도록 설계돼 있어서 안 드러났을 뿐이다). body 아래쪽의
     min-height:100dvh만으로 충분하므로 고정 height는 제거한다. */
  html,body{margin:0;}
  body{
    font-family:'Pretendard','Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    color:var(--cream); background:
      radial-gradient(1400px 700px at 50% -12%, rgba(233,196,106,.11), transparent 60%),
      radial-gradient(1100px 600px at 8% 105%, rgba(139,108,255,.07), transparent 55%),
      radial-gradient(1100px 600px at 96% 105%, rgba(77,166,255,.07), transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    min-height:100dvh; overflow-x:hidden; user-select:none;
  }
  /* 2026-09-03 대표 지시: 카드가 세로 포스터 비율로 좁게 나와서, 화면 폭을
     더 넓게 써서 카드 자체가 가로로 더 크게(16:9에 가깝게) 나오도록 상한을 올렸다. */
  .wrap{max-width:min(1900px,96vw); margin:0 auto; padding:clamp(10px,1.8vw,22px) clamp(16px,4vw,32px); min-height:100dvh; display:flex; flex-direction:column;}
  .view{display:none; flex:1; flex-direction:column;}
  .view.active{display:flex; animation:fade .35s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:none;}}

  /* ── 헤더 (2026-09-03 4차 정정: "바" 컨테이너에는 태그라인만.
     5차, 대표 지시: 제목이 먼저, 태그라인이 그 아래로 순서 정정) ── */
  @keyframes blink{50%{opacity:.25;}}
  .brand{text-align:center; margin:0 auto clamp(10px,1.6vw,18px);}
  .tagline-top{display:inline-block; color:var(--muted); font-size:clamp(12px,1.5vw,15px);
    margin:10px 0 0; letter-spacing:.04em; font-weight:500;
    background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
    border:1px solid var(--line); border-radius:999px; padding:7px 20px;}
  h1{font-size:clamp(28px,5vw,48px); line-height:1.05; margin:0; font-weight:800; letter-spacing:-.01em;}
  h1 .gold{
    background:linear-gradient(135deg,var(--gold-soft) 0%,var(--gold) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  /* ── 엔진 준비 배너 ── */
  .enginebar{max-width:520px; margin:14px auto 0; border:1px solid var(--line); border-radius:14px; padding:10px 16px;
    background:rgba(255,255,255,.03); font-size:13px; color:var(--muted); text-align:center; display:none;}
  .enginebar.show{display:block;}
  .enginebar b{color:var(--gold);}
  .enginebar.err{border-color:rgba(255,84,112,.4); background:rgba(255,84,112,.08);}
  .enginebar.err b{color:var(--danger);}

  /* ── 장르 타일 (2026-09-03 1차: 화면을 꽉 채우는 대형 카드 + 호버 영상 미리보기.
     2026-09-03 2차, 대표 지시: 카드를 16:9 비율로, 호버 시 반투명 틴트+글로우 추가) ── */
  /* 좁은 화면(세로 태블릿/폰)에서는 카드에 16:9를 강제하면 화면 대비 카드
     블록이 너무 작아져 위아래로 큰 빈 공간이 남는다(가로폭이 짧아 16:9 카드가
     그만큼 낮아지기 때문) — 그래서 모바일은 이전 방식대로 남는 세로 공간을
     꽉 채우고, 16:9는 가로 폭이 넉넉한 데스크탑(760px 이상)에서만 강제한다. */
  /* 2026-09-03 3차 대표 지시(카드 2배)로 3열→2열까지 갔다가, 화면 하나에
     6개가 안 들어와 스크롤이 생기는 걸 보고 4차에서 다시 정정: 3열×2행은
     유지하되 스크롤 없이 한 화면에 맞도록 크기를 되돌린다(1차 크기보다는
     살짝 크게, wrap 폭을 1560px→1680px 정도로만 완만하게 키움). */
  .grid{flex:1; min-height:0; display:grid; grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(3,1fr);
    gap:clamp(14px,2.3vw,24px);}
  @media (min-width:760px){
    .grid{grid-template-columns:repeat(3,1fr); grid-template-rows:none; align-content:center;}
    .tile{aspect-ratio:16/9;}
  }
  .tile{position:relative; border-radius:24px; background:#05070f; cursor:pointer;
    overflow:hidden; min-height:0; box-shadow:0 14px 34px rgba(0,0,0,.4);
    transition:transform .15s ease, box-shadow .25s ease;}
  .tile:hover{box-shadow:0 18px 44px rgba(0,0,0,.55), 0 0 0 2px var(--c), 0 0 48px 6px color-mix(in srgb, var(--c) 55%, transparent);}
  .tile:active{transform:scale(.97);}
  .tile::after{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--c); z-index:2;}
  .tile-media{position:absolute; inset:0;}
  .tile-media .thumb, .tile-media .preview{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:opacity .25s ease, transform .3s ease;}
  .tile-media .preview{opacity:0;}
  .tile:hover .tile-media .thumb, .tile:hover .tile-media .preview{transform:scale(1.05);}
  /* 포털(edutogether.kr) 카드 호버 패턴 참고 — 반투명 색 블록 오버레이. */
  .tile-tint{position:absolute; inset:0; background:var(--c); opacity:0; mix-blend-mode:overlay; z-index:1; pointer-events:none; transition:opacity .25s ease;}
  .tile:hover .tile-tint{opacity:.4;}
  .tile-scrim{position:absolute; inset:0; background:linear-gradient(180deg, rgba(5,7,15,.05) 35%, rgba(5,7,15,.92) 100%); z-index:1;}
  .tile-body{position:absolute; left:0; right:0; bottom:0; z-index:2; padding:clamp(14px,2.4vw,24px);
    display:flex; flex-direction:column; gap:6px;}
  /* 2026-09-03 5차, 대표 지시: 아이콘을 제목 위 별도 줄이 아니라 제목과 같은 줄
     왼쪽에 인라인으로, 색도 장르색 대신 흰색으로 통일. */
  .tile-body .gname-row{display:flex; align-items:center; gap:9px;}
  .tile-body .ic{color:#fff; filter:drop-shadow(0 4px 10px rgba(0,0,0,.5)); display:flex; flex:none;}
  .tile-body .ic svg{width:clamp(20px,2.8vw,28px); height:clamp(20px,2.8vw,28px); display:block;}
  .tile-body .gname{font-size:clamp(19px,2.6vw,28px); font-weight:800;}
  .tile-body .gsub{font-size:clamp(12px,1.6vw,15px); color:var(--muted); line-height:1.4;}
  .tile.locked{opacity:.45; cursor:not-allowed;}
  .tile.locked:active{transform:none;}
  .badge{position:absolute; top:12px; right:12px; font-size:11px; color:var(--gold); border:1px solid var(--line); border-radius:999px; padding:3px 9px; background:rgba(0,0,0,.25); z-index:2;}

  /* ── 스튜디오 ── */
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:clamp(14px,2.5vw,22px);}
  .back{appearance:none; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--cream); border-radius:14px;
    padding:11px 16px; font-size:15px; font-weight:600; cursor:pointer;}
  .back:active{transform:scale(.96);}
  .chip{margin-left:auto; display:inline-flex; align-items:center; gap:9px; font-weight:700; font-size:clamp(15px,2vw,18px);
    border:1px solid var(--line); border-radius:14px; padding:9px 16px; background:rgba(255,255,255,.03);}
  .chip .e{font-size:20px; display:inline-flex;}
  .chip .e svg{width:20px; height:20px; display:block;}

  .stage{position:relative; border-radius:20px; overflow:hidden; background:#000; border:1px solid var(--line);
    box-shadow:var(--shadow); aspect-ratio:16/9;}
  .stage video{width:100%; height:100%; object-fit:cover; display:block; background:#000;}
  .filmtop,.filmbot{position:absolute; left:0; right:0; height:18px; background:
    repeating-linear-gradient(90deg,#0c1330 0 14px, transparent 14px 30px); opacity:.0; pointer-events:none;}
  .filmtop{top:0;} .filmbot{bottom:0;}

  /* 카운트다운 / REC 오버레이 */
  .overlay{position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(7,11,26,.55); backdrop-filter:blur(2px);}
  .overlay.show{display:flex;}
  .count{font-size:clamp(80px,22vw,200px); font-weight:800; color:var(--gold); text-shadow:0 0 50px rgba(233,196,106,.5); animation:pop .9s ease;}
  @keyframes pop{0%{transform:scale(.4); opacity:0;}40%{transform:scale(1.05); opacity:1;}100%{transform:scale(1); opacity:1;}}
  .recpill{position:absolute; top:14px; left:14px; display:none; align-items:center; gap:9px; background:rgba(255,84,112,.16);
    border:1px solid rgba(255,84,112,.5); color:#ffd7df; padding:8px 14px; border-radius:999px; font-weight:700; font-size:14px;}
  .recpill.show{display:inline-flex;}
  .recpill .d{width:11px; height:11px; border-radius:50%; background:var(--danger); box-shadow:0 0 14px var(--danger); animation:blink 1s infinite;}

  .progress{height:7px; background:rgba(255,255,255,.08); border-radius:99px; margin-top:14px; overflow:hidden; opacity:0; transition:opacity .2s;}
  .progress.show{opacity:1;}
  .progress > i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--gold),var(--gold-soft));}

  .controls{margin-top:clamp(18px,3vw,28px); display:flex; flex-direction:column; align-items:center; gap:16px;}
  .hint{color:var(--muted); font-size:clamp(14px,2vw,17px); text-align:center; min-height:1.4em;}
  .btn{appearance:none; border:none; cursor:pointer; font-weight:800; border-radius:18px; transition:transform .12s ease, filter .2s;}
  .btn:active{transform:scale(.96);}
  .btn-rec{width:clamp(150px,40vw,200px); height:clamp(150px,40vw,200px); border-radius:50%; font-size:clamp(18px,2.6vw,22px);
    color:#1a1205; background:radial-gradient(circle at 50% 35%, var(--gold-soft), var(--gold)); box-shadow:0 0 0 10px rgba(233,196,106,.12), 0 20px 50px rgba(233,196,106,.25);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;}
  .btn-rec .ic{font-size:clamp(40px,9vw,60px);}
  .btn-rec[disabled]{filter:grayscale(.6) brightness(.7); cursor:default;}
  .row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; width:100%;}
  .btn-lg{padding:18px 22px; font-size:clamp(16px,2.2vw,19px); min-width:130px; flex:1 1 130px; max-width:220px;}
  .btn-ghost{background:rgba(255,255,255,.05); color:var(--cream); border:1px solid var(--line);}
  .btn-gold{background:linear-gradient(180deg,var(--gold-soft),var(--gold)); color:#1a1205;}
  .btn-save{background:linear-gradient(180deg,#46e0a6,var(--ok)); color:#04261a;}

  /* ── 결과 / QR ── */
  .result-card{margin:auto; text-align:center; max-width:520px; width:100%;}
  .spinner{width:64px; height:64px; border-radius:50%; border:5px solid rgba(233,196,106,.2); border-top-color:var(--gold);
    margin:0 auto 22px; animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .qrbox{background:#fff; padding:20px; border-radius:24px; display:inline-block; box-shadow:var(--shadow); margin:10px 0 6px;}
  .qrbox img{display:block; width:clamp(220px,55vw,300px); height:auto;}
  .result-card h2{font-size:clamp(24px,4vw,34px); margin:6px 0;}
  .result-card h2 .gold{color:var(--gold);}
  .result-card p{color:var(--muted); font-size:clamp(14px,2vw,17px); margin:6px 0 22px;}
  .savemode{font-size:12px; color:var(--muted); margin-top:14px;}

  .errbox{border:1px solid rgba(255,84,112,.4); background:rgba(255,84,112,.08); color:#ffd7df; border-radius:16px; padding:18px; margin:18px 0; text-align:left; font-size:14px; line-height:1.6; display:none;}
  .errbox.show{display:block;}
  .footer{margin-top:auto; padding-top:22px; text-align:center; color:var(--muted); font-size:12px; letter-spacing:.04em;}
  .privacy{font-size:11px; color:var(--muted); text-align:center; margin-top:6px; opacity:.8;}
  /* 2026-09-03 1차: 홈 화면 하단 안내문구 3줄을 별도 페이지(privacy.html)로 빼고
     링크만 남김. 2026-09-03 3차(대표 지시): 화면 맨 아래 가운데로 옮기고,
     Be a Googler류의 순수 텍스트 링크(배경/테두리 없이, 작고 조용한 밑줄 링크)
     톤으로 다듬었다. */
  /* 2026-09-03 6차: 팀장 세션이 참고 사이트(g00gler.web.app)의 실제 computed
     style 값을 그대로 전달해 그 값으로 맞췄다. */
  .privacylink{display:inline-block; margin:10px auto 0;
    font-family:'Pretendard Variable','Pretendard','SUIT','Noto Sans KR',system-ui,sans-serif;
    font-size:11px; font-weight:600; color:rgba(255,255,255,.82);
    text-decoration:none; transition:color .2s;}
  .privacylink:hover{color:var(--gold); text-decoration:underline;}

  /* ── 스플래시 (2026-09-03 발견 반영: "렉걸린 듯" 버벅임의 원인 —
     #splash가 body를 완전히 덮는 동안에도 body의 무거운 배경(라디얼
     그라디언트 3장)이 그 아래서 계속 같이 그려지고 있었다. 포스터 스튜디오와
     똑같은 이중 렌더링 패턴. #splash가 떠 있는 동안은 body 배경을 splash와
     같은 단순한 단색으로 잠깐 바꿔, 안 보이는데도 무거운 그라디언트를
     겹쳐 그리는 낭비를 없앤다 — splash가 사라지면 :has()가 더 이상
     매치되지 않아 원래 그라디언트 배경으로 자연스럽게 돌아온다.) ── */
  body:has(#splash){background:var(--bg);}
  #splash{position:fixed; inset:0; z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:linear-gradient(180deg,var(--bg),var(--bg2)); transition:opacity .5s ease;}
  #splash.hide{opacity:0; pointer-events:none;}
  #splash .logo{font-size:clamp(48px,10vw,72px); filter:drop-shadow(0 10px 24px rgba(233,196,106,.35)); animation:splashPop .6s ease;}
  #splash .name{font-size:clamp(26px,5vw,38px); font-weight:800; letter-spacing:-.01em; color:var(--cream);}
  #splash .name .gold{color:var(--gold);}
  #splash .stagline{font-size:clamp(13px,2vw,16px); color:var(--muted);}
  #splash .sbar{display:block; width:190px; height:3px; border-radius:99px; background:rgba(233,196,106,.2); overflow:hidden; margin-top:4px;}
  /* 2026-09-03 발견 반영: margin-left로 움직이던 걸 transform:translateX로 바꿨다 —
     margin은 매 프레임 레이아웃을 다시 계산시켜(리플로우) 태블릿 등에서 버벅임의
     또 다른 원인이었다. transform은 컴포지터에서만 처리돼 리플로우가 없다. */
  #splash .sbar i{display:block; width:40%; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--gold),var(--gold-soft)); animation:splashBar 1.15s ease-in-out infinite; will-change:transform;}
  @keyframes splashPop{0%{transform:scale(.6); opacity:0;}60%{transform:scale(1.08); opacity:1;}100%{transform:scale(1);}}
  @keyframes splashBar{0%{transform:translateX(-76px);}100%{transform:translateX(190px);}}
</style>
</head>
<body>
<div id="splash">
  <div class="logo">🎬</div>
  <div class="name">InKY <span class="gold">Voice Cinema</span></div>
  <div class="stagline">무성영화에 내 목소리를 더빙해 완성하는 나만의 영화</div>
  <span class="sbar"><i></i></span>
</div>
<div class="wrap">

  <!-- ════ 메인: 장르 선택 ════ -->
  <section id="home" class="view active">
    <div class="brand">
      <h1>InKY <span class="gold">Voice Cinema</span></h1>
      <p class="tagline-top">상상을 현실로 — 내 목소리로 완성하는 영화</p>
    </div>
    <div class="enginebar" id="enginebar">엔진 준비 중… <b id="engineProg">0%</b></div>
    <div class="grid" id="grid"></div>
    <a class="privacylink" href="./privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>
  </section>

  <!-- ════ 스튜디오: 녹음 ════ -->
  <section id="studio" class="view">
    <div class="topbar">
      <button class="back" id="studioBackBtn">← 처음으로</button>
      <span class="chip"><span class="e" id="chipEmoji">🎬</span><span id="chipName">장르</span></span>
    </div>

    <div class="stage">
      <div class="filmtop"></div><div class="filmbot"></div>
      <video id="clip" playsinline muted preload="auto"></video>
      <div class="recpill" id="recpill"><span class="d"></span> REC</div>
      <div class="overlay" id="overlay"><div class="count" id="count">3</div></div>
    </div>
    <div class="progress" id="progress"><i id="bar"></i></div>

    <div class="controls">
      <div class="hint" id="hint">먼저 [미리 보기]로 영상을 확인하고, 준비되면 녹음하세요</div>

      <!-- 미리 보기 버튼 (준비 단계) -->
      <button class="btn btn-lg btn-ghost" id="previewBtn">▶ 미리 보기</button>

      <!-- 녹음 시작 버튼 -->
      <button class="btn btn-rec" id="recBtn">
        <span class="ic">🎤</span><span>녹음 시작</span>
      </button>

      <!-- 녹음 후 버튼 묶음 -->
      <div class="row" id="afterRow" style="display:none;">
        <button class="btn btn-lg btn-ghost" id="replayBtn">▶ 다시 듣기</button>
        <button class="btn btn-lg btn-gold" id="resetBtn">🔄 다시 녹음</button>
        <button class="btn btn-lg btn-save" id="saveBtn">💾 저장하기</button>
      </div>
    </div>
    <div class="footer" id="studioFoot"></div>
  </section>

  <!-- ════ 결과: QR ════ -->
  <section id="result" class="view">
    <div class="result-card">
      <div id="loading">
        <div class="spinner"></div>
        <h2 id="loadingTitle">영화를 만들고 있어요…</h2>
        <p id="loadingSub">목소리를 영상에 입히는 중입니다</p>
      </div>

      <div id="done" style="display:none;">
        <h2>🎉 <span class="gold">완성!</span></h2>
        <p id="doneMsg">휴대폰 카메라로 QR을 스캔하면 내 영화를 받을 수 있어요</p>
        <div class="qrbox" id="qrbox" style="display:none;"><img id="qrImg" alt="QR 코드"></div>
        <div class="row" id="downloadRow" style="display:none; margin-top:10px;">
          <button class="btn btn-lg btn-save" id="downloadBtn">📥 이 기기에 저장</button>
        </div>
        <div class="savemode" id="savemode"></div>
        <p class="savemode" style="margin-top:4px;">⏰ 다운로드는 2026년 11월 30일까지만 가능해요 — 그 이후엔 자동으로 삭제됩니다</p>
        <div class="row" style="margin-top:26px;">
          <button class="btn btn-lg btn-gold" id="doneHomeBtn">🎬 다른 더빙 하기</button>
        </div>
      </div>

      <div class="errbox" id="errbox"></div>
      <div class="row" id="errRow" style="display:none;">
        <button class="btn btn-lg btn-ghost" id="errBackBtn">← 돌아가기</button>
      </div>
    </div>
  </section>

</div>

<script>
  setTimeout(() => {
    const s = document.getElementById('splash');
    if (s) { s.classList.add('hide'); setTimeout(() => s.remove(), 600); }
  }, 1800);
</script>
<script src="./vendor/qrcode.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
