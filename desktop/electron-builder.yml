# Voice Cinema Windows 설치판 — desktop/에서 `npm run dist`가 웹을 빌드한 뒤 이 설정으로 release/VoiceCinema-Setup.exe를 만든다.
appId: kr.edutogether.voicecinema
productName: Voice Cinema
copyright: © 2026 같이교육
directories:
  output: release
  buildResources: build
files:
  - main.js
  - bundle.js
  - save-path.js
  - package.json
# 화면은 웹과 같은 산출물을 그대로 싣는다(새로 만들지 않는다). firebase.json은 보안 헤더(CSP 등)를 웹과 똑같이 붙이려고 함께 싣는다.
extraResources:
  - from: ../dist
    to: web
  - from: ../firebase.json
    to: firebase.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
# 일반 설치 프로그램: 사용자별 설치(관리자 권한 없이)가 기본이고 위치를 고를 수 있다. 시작 메뉴 · 바탕화면 바로가기, 설치 뒤 바로 실행,
# «앱 및 기능»에서 제거. 제거하면 앱 데이터(%APPDATA%\Voice Cinema)도 지운다 — 학생 녹음은 거기 남지 않지만 기기에 흔적을 두지 않는다.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Voice Cinema
  uninstallDisplayName: Voice Cinema
  runAfterFinish: true
  deleteAppDataOnUninstall: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  # 한국어 하나만 싣는다. multiLanguageInstaller를 끄면 electron-builder가 language 값과 상관없이 영어(en_US)만 넣는다(10/27 실제로 영어 화면이 나왔다).
  multiLanguageInstaller: true
  installerLanguages: [ko_KR]
  language: '1042'
  artifactName: VoiceCinema-Setup.${ext}
